<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dmultichoice - Digital Solutions &amp; Global Procurement</title>

      content="Dmultichoice provides digital solutions, global procurement, and training to help businesses grow, scale, and compete globally through technology, automation, and smart purchasing."
    />
    <meta name="robots" content="index,follow" />

    <!-- Canonical (route-aware canonical can be injected by app; this is a safe default) -->

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Dmultichoice - Digital Solutions &amp; Global Procurement"
    />

      property="og:description"
      content="Digital solutions and global procurement to help businesses grow through technology, automation, and smart procurement."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://www.dmultichoice.com/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Dmultichoice - Digital Solutions &amp; Global Procurement"
    />
    <meta
      name="twitter:description"
      content="Digital solutions and global procurement to help businesses grow through technology, automation, and smart procurement."

    <!-- Optional theme -->
    <meta name="theme-color" content="#2563eb" />
  </head>

    <div id="root"></div>
