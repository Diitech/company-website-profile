<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="56" stroke="url(#grad)" stroke-width="2.5" opacity="0.3"/>
  <!-- Inner glow -->
  <circle cx="60" cy="60" r="48" fill="url(#bg-grad)" opacity="0.15"/>
  <!-- Core icon -->
  <g transform="translate(60,60)">
    <!-- Brain/neural lines -->
    <circle cx="0" cy="0" r="22" stroke="url(#grad)" stroke-width="1.8" fill="none"/>
    <circle cx="0" cy="0" r="14" stroke="url(#grad)" stroke-width="1.5" fill="none" opacity="0.6"/>
    <circle cx="0" cy="0" r="28" stroke="url(#grad)" stroke-width="1" fill="none" opacity="0.2" stroke-dasharray="4 4"/>
    <!-- Nodes -->
    <circle cx="0" cy="-22" r="4.5" fill="#3B82F6"/>
    <circle cx="21" cy="-7" r="4.5" fill="#06B6D4"/>
    <circle cx="13" cy="18" r="4.5" fill="#22C55E"/>
    <circle cx="-13" cy="18" r="4.5" fill="#8B5CF6"/>
    <circle cx="-21" cy="-7" r="4.5" fill="#F59E0B"/>
    <circle cx="0" cy="0" r="5.5" fill="white" opacity="0.9"/>
    <!-- Connections -->
    <line x1="0" y1="-18" x2="17" y2="-5" stroke="#3B82F6" stroke-width="1.2" opacity="0.5"/>
    <line x1="0" y1="-18" x2="-17" y2="-5" stroke="#F59E0B" stroke-width="1.2" opacity="0.5"/>
    <line x1="17" y1="-5" x2="10" y2="15" stroke="#06B6D4" stroke-width="1.2" opacity="0.5"/>
    <line x1="-17" y1="-5" x2="-10" y2="15" stroke="#8B5CF6" stroke-width="1.2" opacity="0.5"/>
    <line x1="10" y1="15" x2="-10" y2="15" stroke="#22C55E" stroke-width="1.2" opacity="0.5"/>
    <line x1="0" y1="-18" x2="0" y2="-5" stroke="white" stroke-width="1" opacity="0.3"/>
    <!-- Center sparkle -->
    <path d="M0 -2.5 L0.8 0 L3 0 L1.2 1.5 L2 4 L0 2.5 L-2 4 L-1.2 1.5 L-3 0 L-0.8 0 Z" fill="white" opacity="0.7"/>
  </g>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>